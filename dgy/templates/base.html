<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}大观园{% endblock %} · 数二刷题</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c63e0'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>大观园</a>
      <nav class="nav" aria-label="主导航">
        <a href="/" {% if nav == 'home' %}aria-current="page"{% endif %}>首页</a>
        <a href="/bank" {% if nav == 'bank' %}aria-current="page"{% endif %}>题库</a>
        <a href="/knowledge" {% if nav == 'knowledge' %}aria-current="page"{% endif %}>知识点</a>
        <a href="/history" {% if nav == 'history' %}aria-current="page"{% endif %}>学习记录</a>
        <a href="/settings" {% if nav == 'settings' %}aria-current="page"{% endif %}>设置</a>
      </nav>
    </div>
  </header>
  <main id="main" class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
  <script src="/static/js/app.js?v={{ asset_v }}" defer></script>
</body>
</html>
