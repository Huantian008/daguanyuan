[project]
name = "daguanyuan"
version = "0.1.0"
description = "大观严选数二本地刷题站"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "pdf: needs the source PDFs in the parent folder (slow)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
